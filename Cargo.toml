[workspace]
resolver = "2"
members = ["crates/tmate2-hid", "crates/tmate2-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/tmate2-connector"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
