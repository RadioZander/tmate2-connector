[workspace]
resolver = "2"
members = [
    "crates/tmate2-hid",
    "crates/tmate2-probe",
    "crates/tmate2-core",
    "crates/tmate2-backends",
    "crates/tmate2-app",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/RadioZander/tmate2-connector"
rust-version = "1.95"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
strsim = "0.11"

[profile.release]
lto = "thin"
strip = true

# The TCI-X login's scrypt is slow unoptimised; keep debug builds usable.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
