name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build
# the binaries and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          # Ubuntu 22.04 runners keep the glibc requirement low enough for
          # Raspberry Pi OS Bookworm and most current Linux distributions.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - name: linux-arm64-raspberry-pi
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            exe: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tmate2-app -p tmate2-probe
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$version" == v* ]] || version="dev-${GITHUB_SHA::7}"
          dir="tmate2-connector-${version}-${{ matrix.name }}"
          mkdir "$dir"
          for bin in tmate2 tmate2-probe; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.exe }}" "$dir/"
          done
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "$dir/"
          cp -r licenses "$dir/"
          cp crates/tmate2-core/src/default_config.toml "$dir/config.example.toml"
          cp docs/hardware-bringup.md "$dir/"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp packaging/linux/50-tmate2.rules "$dir/"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
