[package]
name = "tmate2-app"
description = "TMATE-2 connector: drives the ELAD / Woodbox TMATE-2 and controls a radio over TCI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tmate2"
path = "src/main.rs"

[dependencies]
tmate2-hid = { path = "../tmate2-hid" }
tmate2-core = { path = "../tmate2-core" }
tmate2-backends = { path = "../tmate2-backends" }
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap.workspace = true
anyhow.workspace = true
directories.workspace = true
eframe = { version = "0.32.3", optional = true }
toml_edit = { version = "0.25.19", optional = true }

[features]
default = ["gui"]
# Desktop window. Build with --no-default-features for a headless-only binary.
gui = ["dep:eframe", "dep:toml_edit"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }
