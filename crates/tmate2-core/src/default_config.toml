# TMATE-2 connector configuration
#
# Plain TOML: lines starting with # are comments. Edit freely; the program
# re-reads this file when it starts.

[radio]
# How to talk to the radio. Currently: "tci".
backend = "tci"
# TCI server address. Thetis: Setup > Serial/Network > TCI.
host = "127.0.0.1"
port = 50001
# TCI-X extensions (github.com/g0kad/TCI-X):
#   "off"  - plain TCI only
#   "auto" - ask the server; quietly fall back to plain TCI if it doesn't answer
#   "on"   - like auto, but warn if the server doesn't support TCI-X
tcix = "auto"
# Which receiver / transceiver the TMATE-2 controls (0 = the first).
trx = 0

[display]
# LCD contrast in percent: 100 is darkest, 0 is faintest.
contrast = 100
# Backlight colours as [red, green, blue], each 0-255.
backlight = [255, 255, 255]
backlight_tx = [255, 0, 0]
backlight_disconnected = [255, 120, 0]
# Small 3-digit readout: "dbm" (e.g. -73 dBm), "s_units" (e.g. S9) or "off".
readout = "dbm"
# How long (ms) a value you change with E1 / E2 is shown on the main display.
flash_ms = 1500
# How E1 VOL shows and steps the master volume:
#   "percent" - 0 to 100, matching Thetis's Master AF (1 per click)
#   "db"      - TCI's own -60 to 0 dB (1 dB per click), for other software
volume_scale = "percent"
# While transmitting, the S-meter scale is switched off and:
#   tx_meter   (bargraph):     "power", "swr" (1.8:1 at S9, 3:1 full) or "off"
#   tx_readout (small digits): "watts", "swr" or "off". The readout has no
#     decimal point, so SWR shows as 1_2 for 1.2:1 (Hi from 10:1).
tx_meter = "power"
tx_readout = "watts"
# Power in W that fills the bargraph (the ANAN-G2 is a 100 W radio).
tx_power_max_w = 100

[tuning]
# Tuning steps for the main knob; the step digit is underlined on the LCD.
steps_hz = [1, 10, 100, 1000, 10000, 100000]
# Step to start with (must be one of the above).
step_hz = 10
# Main knob acceleration when spun quickly, 0 to 10:
# 0 = off, 2 = gentle, 5 = normal, 10 = strong.
acceleration = 5
# E1 / E2 encoder counts per click (2 on HW1.1 / FW1.5).
counts_per_detent = 2
# Filter edge / shift change per E2 click, in Hz.
filter_step_hz = 50
# RIT / XIT change per E2 click, in Hz.
rit_step_hz = 10
# Modes stepped through by mode_next / mode_prev.
mode_cycle = ["LSB", "USB", "CWU", "AM", "FM", "DIGU"]
# While the fast action is on, the main knob's step is multiplied by this.
fast_multiplier = 10

# The bottom row of the LCD shows what each knob is set to. Push the knob to
# step through its functions (see e1_push / e2_push below).
#   E1 can be: vol, sql, rfg, drv, nr, nb, an
#   E2 can be: high, low, width, shift, rit, xit
#   (width has no label of its own, so HIGH and LOW light together)
# Either knob can also have these, which have no LCD label (only the value
# shown on the main display tells you which one is selected):
#   rx_vol     the controlled receiver's own volume (Thetis RX1 / RX2 AF)
#   mon_vol    TX monitor volume
#   cw_speed   CW keyer speed (WPM)
#   tune_drive drive used while tuning
# "start" is the function each knob is on when the connector starts.
[e1]
functions = ["vol", "sql", "rfg", "drv", "nr", "nb", "an"]
start = "vol"

[e2]
functions = ["high", "low", "width", "shift", "rit", "xit"]
start = "width"

# Default receive filter per mode, as [low, high] passband edges in Hz from
# the carrier (lower-sideband modes are negative). Holding E2 while it is on
# high, low, width or shift puts the current mode's default back.
[filters]
LSB = [-2500, -100]
USB = [100, 2500]
CWL = [-850, -350]
CWU = [350, 850]
DIGL = [-3000, 0]
DIGU = [0, 3000]
AM = [-5000, 5000]
SAM = [-5000, 5000]
DSB = [-3300, 3300]
FM = [-8000, 8000]
NFM = [-5500, 5500]

# What each button and knob push does:
#   tap  = a short press
#   hold = pressed for hold_ms or longer
# Use "none" for nothing. If hold is "none", tap fires as soon as the button
# is pressed; otherwise tap fires on release (so the two can be told apart).
# Stepping actions (step_next/prev, e1_next, e2_next, mode_next/prev,
# band_up/down, filter_wider/narrower, agc_next, backlight_next) used as hold
# keep repeating while the button stays down.
#
# Actions:
#   Frequency and VFO
#     band_up  band_down
#     vfo_toggle (main knob tunes A or B)  vfo_a_to_b  vfo_b_to_a  vfo_swap
#     step_next  step_prev
#     fast       main knob step x fast_multiplier, on/off
#     rx2        second receiver on/off
#     sub_rx     sub-receiver (second channel) on/off
#     knob_rx2   knobs and display control the other receiver (RX1 <-> RX2)
#   Mode and filter
#     mode_next  mode_prev  mode:USB (any mode name)
#     filter_default  (the mode's filter from [filters])
#     filter_wider  filter_narrower  (by filter_step_hz)
#   Receiver
#     nr  nb  anf (automatic notch)  notch (manual notch filter)
#     squelch (on/off)  apf (audio peak filter)  binaural
#     agc_next (long, slow, normal, fast)
#     agc:fast (off, long, slow, normal, fast or custom)
#   Audio
#     mute (master)  rx1_mute  rx2_mute  monitor (TX monitor on/off)
#   Transmit
#     mox (transmit on/off!)  ptt (transmit only while the button is held)
#     tune (tune carrier on/off)  tune_hold (tune only while held)
#   RIT / XIT
#     split  rit  xit  rit_clear  xit_clear  rit_xit_clear  lock
#   Knobs
#     e1_next  e2_next  e1_toggle  e2_toggle   (toggle = on/off for the
#       knob's current function; for the filter functions it restores the
#       mode's default filter from [filters])
#   Radio and connector
#     power (start / stop the radio)  focus (bring the radio software's
#     window to the front)  backlight_next (cycle the backlight presets
#     until the next restart or settings change)
#   raw:<text>   sends <text> to the radio unchanged, e.g. raw:trx:0,true;
#   none
[buttons]
hold_ms = 500
# Ignore a knob push within this many ms of turning that same knob, and
# cancel a push if the knob turns while it is held (stops accidental clicks).
push_lockout_ms = 300
# While held, repeat a stepping hold action every this many ms (0 = no repeat).
hold_repeat_ms = 500

f1 = { tap = "mox", hold = "none" }
f2 = { tap = "nr", hold = "none" }
f3 = { tap = "nb", hold = "none" }
f4 = { tap = "anf", hold = "none" }
f5 = { tap = "band_down", hold = "none" }
f6 = { tap = "band_up", hold = "none" }
main_push = { tap = "vfo_toggle", hold = "step_next" }
e1_push = { tap = "e1_next", hold = "e1_toggle" }
e2_push = { tap = "e2_next", hold = "e2_toggle" }
